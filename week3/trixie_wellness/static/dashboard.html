<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Evaluation Dashboard</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #eef2f5; padding: 20px; border-radius: 8px; text-align: center; border-left: 5px solid #3498db; }
        .card h3 { margin: 0 0 10px 0; font-size: 16px; color: #555; }
        .card .score { font-size: 32px; font-weight: bold; color: #2980b9; }
        .card.retrieval { border-color: #e67e22; }
        .card.retrieval .score { color: #d35400; }
        .card.response { border-color: #27ae60; }
        .card.response .score { color: #219150; }
        .controls { text-align: center; margin-top: 30px; }
        button { padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2980b9; }
        .status { margin-top: 15px; font-size: 14px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>LLM Evaluation Metrics</h1>
    <div style="text-align: center; color: #7f8c8d;">Total Evaluation Runs: <span id="total-runs">0</span></div>

    <h2>Retrieval Quality</h2>
    <div class="grid">
        <div class="card retrieval">
            <h3>Context Precision</h3>
            <div class="score" id="m-precision">-</div>
        </div>
        <div class="card retrieval">
            <h3>Context Recall</h3>
            <div class="score" id="m-recall">-</div>
        </div>
        <div class="card retrieval">
            <h3>Faithfulness</h3>
            <div class="score" id="m-faithfulness">-</div>
        </div>
    </div>

    <h2 style="margin-top: 40px;">Response Quality</h2>
    <div class="grid">
        <div class="card response">
            <h3>Relevance</h3>
            <div class="score" id="m-relevance">-</div>
        </div>
        <div class="card response">
            <h3>Helpfulness</h3>
            <div class="score" id="m-helpfulness">-</div>
        </div>
        <div class="card response">
            <h3>Groundedness</h3>
            <div class="score" id="m-groundedness">-</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="runEvaluation()">Trigger New Evaluation Batch</button>
        <button onclick="fetchDashboard()" style="background-color: #7f8c8d; margin-left: 10px;">Refresh Metrics</button>
        <div class="status" id="status-msg"></div>
    </div>
</div>

<script>
    async function fetchDashboard() {
        const msg = document.getElementById('status-msg');
        msg.innerText = "Fetching latest metrics...";
        try {
            const res = await fetch('/api/evaluation/dashboard');
            const data = await res.json();
            if(data.status === 'success' && data.total_runs > 0) {
                document.getElementById('total-runs').innerText = data.total_runs;
                document.getElementById('m-precision').innerText = data.metrics.context_precision.toFixed(1) + "/5";
                document.getElementById('m-recall').innerText = data.metrics.context_recall.toFixed(1) + "/5";
                document.getElementById('m-faithfulness').innerText = data.metrics.faithfulness.toFixed(1) + "/5";
                document.getElementById('m-relevance').innerText = data.metrics.relevance.toFixed(1) + "/5";
                document.getElementById('m-helpfulness').innerText = data.metrics.helpfulness.toFixed(1) + "/5";
                document.getElementById('m-groundedness').innerText = data.metrics.groundedness.toFixed(1) + "/5";
                msg.innerText = "Metrics updated.";
            } else {
                msg.innerText = "No evaluation data found. Trigger a batch run first.";
            }
        } catch (e) {
            msg.innerText = "Error fetching dashboard data.";
        }
    }

    async function runEvaluation() {
        const msg = document.getElementById('status-msg');
        msg.innerText = "Triggering evaluation...";
        try {
            const res = await fetch('/api/evaluation/run', { method: 'POST' });
            const data = await res.json();
            msg.innerText = "Batch evaluation triggered. Check back in a few minutes and refresh metrics.";
        } catch (e) {
            msg.innerText = "Error triggering evaluation.";
        }
    }

    // Load on init
    fetchDashboard();
</script>

</body>
</html>
